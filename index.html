<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Team Picker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

    <header>
        <h1>🎲 Random Team Picker</h1>
        <p>Create fair teams from a list of names</p>
    </header>

    <div class="card">

        <label for="names">Names (one per line)</label>
        <textarea id="names" placeholder="Alice&#10;Bob&#10;Charlie&#10;David"></textarea>

        <p id="count" class="info">0 names</p>

        <div id="duplicateWarning" class="warning hidden"></div>

        <div class="controls">
            <div>
                <label for="teamCount">Number of Teams</label>
                <input type="number" id="teamCount" min="2" value="2">
            </div>

            <button id="generateBtn">Generate Teams</button>
        </div>

        <div id="error" class="error hidden"></div>

    </div>

    <div id="results" class="card hidden">

        <div class="button-row">
            <button id="reshuffleBtn">Reshuffle</button>
            <button id="copyBtn" class="secondary">Copy for WhatsApp</button>
            <button id="clearBtn" class="secondary">Clear</button>
        </div>

        <div id="teamsContainer" class="teams-grid"></div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
